kotlin.code.style=official
# Don't bundle kotlin-stdlib - the IntelliJ Platform provides it. Bundling causes
# loader-constraint conflicts at runtime and Marketplace plugin verification failures.
# Ref: https://plugins.jetbrains.com/docs/intellij/using-kotlin.html
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# IntelliJ Platform
org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true
org.jetbrains.intellij.platform.selfUpdateCheck=false
org.jetbrains.intellij.platform.noSearchableOptionsWarning=false

# E2E Testing - Default Rider path (override with -PriderPath=/path/to/Rider.app/Contents)
riderPath=/Applications/Rider.app/Contents
riderVersion=2025.3

